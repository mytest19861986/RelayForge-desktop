name: Desktop Windows EXE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and smoke test
        shell: cmd
        run: BUILD_EXE_WINDOWS.bat
      - uses: actions/upload-artifact@v4
        with:
          name: RelayForge-Windows-EXE
          path: RelayForge_v*_WINDOWS_EXE.zip
          if-no-files-found: error
