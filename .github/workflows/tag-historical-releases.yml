name: Tag reconstructed desktop releases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tag-historical-releases.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: relayforge-historical-tags
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and create immutable annotated tags
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          assert os.environ["GITHUB_REPOSITORY"].lower() == "mytest19861986/relayforge-desktop"
          base = os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"]
          versions = {"v3.0.0":"c1a7859d320fb1de5cffdc132888d697c152063e","v3.0.1":"7bbcda3efddff28dd277ef2e8d563702a5cef26a","v3.0.2":"c9f384430b334d188fb77a85baa3cf2701c7cf64","v4.0.0":"a45ec6ae0d792798a17360daa0ad93807a2b27a6","v4.1.0":"8e4844f47920c830cdb08b9fed3eeac5d685df53","v4.2.0":"d57e91069f1d820d6270873943d618da9b74aa8c","v4.3.0":"b2d0be7886757e9e4ca8e676e446f8b8aa1e7e7e","v4.3.1":"40cb758837bf892655db99bc4192ccc6ba9eabf5","v4.3.2":"1927f1800d286a09813cfd049b53eb4e399537e8","v4.3.3-rc.1":"46e211b60cb385c71f018cc637eeb9fb7ec204cd"}
          def api(path, data=None, absent=False):
              request = urllib.request.Request(base + path,
                  data=None if data is None else json.dumps(data).encode("utf-8"),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "X-GitHub-Api-Version": "2022-11-28"},
                  method="GET" if data is None else "POST")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  if absent and exc.code == 404:
                      return None
                  raise RuntimeError(f"{request.method} {path}: HTTP {exc.code}") from None
          def target(ref):
              obj = ref["object"]
              for _ in range(5):
                  if obj["type"] == "commit":
                      return obj["sha"]
                  if obj["type"] != "tag":
                      break
                  obj = api("/git/tags/" + obj["sha"])["object"]
              raise RuntimeError("Unexpected tag object")
          missing = []
          for tag, sha in versions.items():
              assert api("/git/commits/" + sha)["sha"] == sha
              ref = api("/git/ref/tags/" + tag, absent=True)
              if ref is None:
                  missing.append((tag, sha))
              elif target(ref) != sha:
                  raise RuntimeError("Existing tag conflict: " + tag)
          for tag, sha in missing:
              obj = api("/git/tags", {"tag": tag, "object": sha, "type": "commit",
                  "message": "RelayForge Desktop " + tag + " — reconstructed historical source snapshot. Live acceptance is not implied."})
              api("/git/refs", {"ref": "refs/tags/" + tag, "sha": obj["sha"]})
          for tag, sha in versions.items():
              assert target(api("/git/ref/tags/" + tag)) == sha
              print(tag, sha, "verified")
          PY
